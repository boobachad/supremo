name: Supremo Booking Test Suite
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: supremo_booking_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Create .env.test
        run: |
          echo "DB_HOST=127.0.0.1" > .env.test
          echo "DB_PORT=3306" >> .env.test
          echo "DB_USER=root" >> .env.test
          echo "DB_PASSWORD=test" >> .env.test
          echo "DB_NAME=ticket_booking_test" >> .env.test
          echo "PORT=3000" >> .env.test
          echo "JWT_SECRET=supersecrettest" >> .env.test
      - run: npm ci
      - run: npm run db:migrate:test
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e